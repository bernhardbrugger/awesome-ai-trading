name: Links
on:
  pull_request:
    paths: ['README.md', '.lychee.toml', '.github/workflows/links.yml']
  schedule:
    - cron: '17 6 1 * *' # monthly
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml README.md CONTRIBUTING.md
          fail: true
